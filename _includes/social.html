<ul class="social-media-list">
  {%- if site.github_url -%}
  <li><a href="{{ site.github_url | escape }}"><svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.rss -%}
  <li><a href="{{ 'feed.xml' | relative_url }}"><svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#rss' | relative_url }}"></use></svg> <span>{{ site.rss | escape }}</span></a></li>
  {%- endif -%}
</ul>
